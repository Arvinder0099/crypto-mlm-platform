<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto MLM Platform - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }
        button:hover { background: #5568d3; }
        .toggle-btn {
            background: #764ba2;
            margin-bottom: 0;
        }
        .toggle-btn:hover { background: #653b81; }
        .message {
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        .loading { opacity: 0.6; pointer-events: none; }
        .status {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 5px;
            font-size: 14px;
        }
        .status.ok { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Crypto MLM</h1>
        <div id="message" class="message"></div>
        
        <!-- Demo Credentials Info -->
        <div style="background: #e3f2fd; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 13px; border-left: 4px solid #2196F3;">
            <strong>📝 Demo Credentials:</strong><br>
            Email: <code>admin@demo.com</code><br>
            Password: <code>123456</code>
        </div>
        
        <!-- Login Form -->
        <div id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button onclick="login()">Sign In</button>
            <button class="toggle-btn" onclick="toggleForm()">Create Account →</button>
        </div>

        <!-- Register Form (hidden) -->
        <div id="registerForm" style="display: none;">
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="John" required>
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Doe" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Phone (Optional)</label>
                <input type="tel" id="phone" placeholder="+1234567890">
            </div>
            <button onclick="register()">Create Account</button>
            <button class="toggle-btn" onclick="toggleForm()">← Back to Login</button>
        </div>

        <div class="status" id="status">
            <strong>System Status:</strong><br>
            Backend: <span id="backendStatus">Checking...</span><br>
            Database: <span id="dbStatus">Checking...</span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3040';

        // Check system status
        async function checkStatus() {
            try {
                const response = await fetch(`${API_URL}/api/health`, {
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    document.getElementById('backendStatus').textContent = '✅ Online';
                    document.getElementById('dbStatus').textContent = '✅ Connected';
                    document.getElementById('status').classList.add('ok');
                } else {
                    document.getElementById('backendStatus').textContent = '❌ Error';
                }
            } catch (error) {
                document.getElementById('backendStatus').textContent = '❌ Offline';
                document.getElementById('dbStatus').textContent = '❌ Not connected';
                document.getElementById('status').classList.add('error');
            }
        }

        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
            document.getElementById('message').textContent = '';
            document.getElementById('message').className = 'message';
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            setTimeout(() => messageEl.className = 'message', 5000);
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Please fill all fields', 'error');
                return;
            }

            try {
                const btn = event.target;
                btn.classList.add('loading');

                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/dashboard.html', 2000);
                } else {
                    showMessage(data.message || 'Login failed', 'error');
                }
                btn.classList.remove('loading');
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function register() {
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const phone = document.getElementById('phone').value;

            if (!firstName || !lastName || !email || !password) {
                showMessage('Please fill all required fields', 'error');
                return;
            }

            try {
                const btn = event.target;
                btn.classList.add('loading');

                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        firstName,
                        lastName,
                        email,
                        password,
                        phone: phone || undefined
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('✅ Account created! Logging in...', 'success');
                    setTimeout(() => {
                        document.getElementById('loginEmail').value = email;
                        document.getElementById('loginPassword').value = password;
                        toggleForm();
                        login();
                    }, 1500);
                } else {
                    showMessage(data.message || 'Registration failed', 'error');
                }
                btn.classList.remove('loading');
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        // Check status on load
        window.addEventListener('load', checkStatus);
    </script>
</body>
</html>
